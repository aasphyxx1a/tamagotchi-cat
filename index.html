<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тамагочи-Котик</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(to bottom, #a1c4fd 0%, #c2e9fb 35%, #d4fc79 65%, #96e6a1 100%);
            color: #333; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .clouds {
            position: absolute;
            top: 5%;
            left: 0;
            width: 100%;
            height: 150px;
            background: url('https://www.transparenttextures.com/patterns/clouds.png') repeat-x;
            opacity: 0.4;
            z-index: 0;
            pointer-events: none;
        }

        /* Контейнер для котика и предметов вокруг него */
        .scene-container {
            position: relative;
            width: 320px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* --- ПРЕДМЕТЫ ВОКРУГ --- */
        .shop-item-decor {
            position: absolute;
            font-size: 35px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
            opacity: 0; /* Изначально скрыты */
            transition: opacity 0.5s ease, transform 0.5s ease;
            z-index: 5;
            /* Добавляем легкую анимацию покачивания для предметов */
            animation: swing 4s ease-in-out infinite alternate;
        }

        .shop-item-decor.active {
            opacity: 0.85; /* Не сильно бросаются в глаза */
        }

        /* Позиции предметов */
        .item-yarn {
            left: -20px;
            bottom: 40px;
            transform: rotate(-15deg);
        }
        .item-mouse {
            right: -20px;
            bottom: 50px;
            transform: rotate(15deg);
        }
        .item-mint {
            bottom: -20px;
            left: 50%;
            margin-left: -17px;
            font-size: 30px;
        }

        @keyframes swing {
            0% { transform: rotate(-10deg); }
            100% { transform: rotate(10deg); }
        }

        /* --- КОТИК --- */
        .cat-container {
            position: relative;
            width: 220px;
            height: 200px;
            cursor: pointer;
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.15));
            z-index: 10;
            transition: transform 0.1s;
        }

        .cat-face {
            position: absolute;
            bottom: 0;
            left: 10px;
            width: 200px;
            height: 140px;
            background-color: #5c6166; 
            border-radius: 100px 100px 80px 80px;
        }

        .ear {
            position: absolute;
            top: -10px;
            width: 60px;
            height: 60px;
            background-color: #5c6166;
            border-radius: 15px 15px 0 0;
            z-index: -1;
        }
        .ear-left { left: 20px; transform: rotate(-20deg); }
        .ear-right { right: 20px; transform: rotate(20deg); }
        
        .ear-inner {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 30px;
            background-color: #404448;
            border-radius: 8px 8px 0 0;
        }

        .eye {
            position: absolute;
            top: 40px;
            width: 36px;
            height: 42px;
            background-color: #222;
            border-radius: 50%;
        }
        .eye-left { left: 40px; }
        .eye-right { right: 40px; }

        .eye::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            width: 14px;
            height: 14px;
            background: white;
            border-radius: 50%;
        }
        .eye::after {
            content: '';
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
        }

        .cheek {
            position: absolute;
            top: 90px;
            width: 28px;
            height: 16px;
            background-color: #ffb6c1;
            border-radius: 50%;
            opacity: 0.8;
        }
        .cheek-left { left: 25px; }
        .cheek-right { right: 25px; }

        .nose {
            position: absolute;
            top: 85px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 10px;
            background-color: #333;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
        }
        .mouth {
            position: absolute;
            top: 95px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 10px;
            border-bottom: 3px solid #333;
            border-radius: 0 0 50% 50%;
        }

        .whisker {
            position: absolute;
            width: 45px;
            height: 2px;
            background-color: #333;
            border-radius: 2px;
        }
        .whisker-l1 { top: 85px; left: -25px; transform: rotate(10deg); }
        .whisker-l2 { top: 98px; left: -25px; transform: rotate(-10deg); }
        .whisker-r1 { top: 85px; right: -25px; transform: rotate(-10deg); }
        .whisker-r2 { top: 98px; right: -25px; transform: rotate(10deg); }

        .paw {
            position: absolute;
            bottom: -10px;
            width: 65px;
            height: 40px;
            background-color: #5c6166;
            border-radius: 30px 30px 20px 20px;
            border: 3px solid #333; 
        }
        .paw-left { left: 20px; }
        .paw-right { right: 20px; }

        .toes {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }
        .toe {
            width: 4px;
            height: 12px;
            background-color: #333;
            border-radius: 2px;
        }
        
        .float-text {
            position: absolute;
            color: #2e7d32; 
            font-weight: bold;
            font-size: 28px;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
            z-index: 50;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-60px); }
        }

        .tab-content { display: none; }
        .tab-content.active { display: flex; }

        .fish-emoji {
            font-size: 32px;
            line-height: 1;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
        }
        .fish-emoji-small {
            font-size: 18px;
            line-height: 1;
            margin-left: 4px;
        }
    </style>
</head>
<body>

    <div class="clouds"></div>

    <!-- Баланс -->
    <div class="p-4 flex justify-center items-center mt-2 z-10">
        <div class="bg-white bg-opacity-80 rounded-full px-6 py-2 flex items-center shadow-md border border-green-300 gap-2">
            <span class="fish-emoji">🐟</span>
            <span id="score" class="text-3xl font-bold text-yellow-600">0</span>
        </div>
    </div>

    <!-- Тапалка -->
    <div id="tab-tap" class="tab-content active flex-grow flex flex-col justify-center items-center relative w-full z-10">
        
        <div class="scene-container">
            <!-- Предметы декора (появляются после покупки) -->
            <div id="decor-yarn" class="shop-item-decor item-yarn">🧶</div>
            <div id="decor-mouse" class="shop-item-decor item-mouse">🐭</div>
            <div id="decor-mint" class="shop-item-decor item-mint">🌿</div>

            <div id="cat" class="cat-container">
                <div class="ear ear-left"><div class="ear-inner"></div></div>
                <div class="ear ear-right"><div class="ear-inner"></div></div>
                <div class="cat-face">
                    <div class="eye eye-left"></div>
                    <div class="eye eye-right"></div>
                    <div class="cheek cheek-left"></div>
                    <div class="cheek cheek-right"></div>
                    <div class="nose"></div>
                    <div class="mouth"></div>
                    <div class="whisker whisker-l1"></div>
                    <div class="whisker whisker-l2"></div>
                    <div class="whisker whisker-r1"></div>
                    <div class="whisker whisker-r2"></div>
                </div>
                <div class="paw paw-left"><div class="toes"><div class="toe"></div><div class="toe"></div></div></div>
                <div class="paw paw-right"><div class="toes"><div class="toe"></div><div class="toe"></div></div></div>
            </div>
        </div>

        <div class="mt-16 text-green-900 font-bold text-lg z-10 opacity-60">Тапай по котику!</div>
    </div>

    <!-- Магазин -->
    <div id="tab-shop" class="tab-content flex-grow flex-col p-4 w-full overflow-y-auto pb-24 z-10 relative">
        <h2 class="text-2xl font-bold text-center mb-4 text-green-900 drop-shadow-sm">🛒 Магазин</h2>
        
        <div class="space-y-3 z-10">
            <!-- Улучшения тапа -->
            <div class="bg-white bg-opacity-90 p-4 rounded-xl flex justify-between items-center shadow-md border border-green-200">
                <div class="flex items-center gap-3">
                    <span class="fish-emoji">🐟</span>
                    <div>
                        <div class="font-bold text-gray-800">Вкусная рыбка</div>
                        <div class="text-xs text-gray-500">+10 к тапу (на 5 сек)</div>
                    </div>
                </div>
                <button onclick="buyItem('fish', 50)" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-bold text-sm transition shadow-sm flex items-center">50 <span class="fish-emoji-small">🐟</span></button>
            </div>

            <!-- Декор: Клубок -->
            <div class="bg-white bg-opacity-90 p-4 rounded-xl flex justify-between items-center shadow-md border border-green-200">
                <div class="flex items-center gap-3">
                    <span class="text-3xl">🧶</span>
                    <div>
                        <div class="font-bold text-gray-800">Клубок шерсти</div>
                        <div class="text-xs text-gray-500">Украшение рядом с котиком</div>
                    </div>
                </div>
                <button id="btn-yarn" onclick="buyItem('yarn', 100000)" class="bg-green-500 hover:bg-green-600 text-white px-3 py-2 rounded-lg font-bold text-sm transition shadow-sm flex items-center">100k <span class="fish-emoji-small">🐟</span></button>
            </div>

            <!-- Декор: Мышка -->
            <div class="bg-white bg-opacity-90 p-4 rounded-xl flex justify-between items-center shadow-md border border-green-200">
                <div class="flex items-center gap-3">
                    <span class="text-3xl">🐭</span>
                    <div>
                        <div class="font-bold text-gray-800">Игрушечная мышка</div>
                        <div class="text-xs text-gray-500">Украшение рядом с котиком</div>
                    </div>
                </div>
                <button id="btn-mouse" onclick="buyItem('mouse', 250000)" class="bg-green-500 hover:bg-green-600 text-white px-3 py-2 rounded-lg font-bold text-sm transition shadow-sm flex items-center">250k <span class="fish-emoji-small">🐟</span></button>
            </div>
            
            <!-- Декор: Мята -->
            <div class="bg-white bg-opacity-90 p-4 rounded-xl flex justify-between items-center shadow-md border border-green-200">
                <div class="flex items-center gap-3">
                    <span class="text-3xl">🌿</span>
                    <div>
                        <div class="font-bold text-gray-800">Кошачья мята</div>
                        <div class="text-xs text-gray-500">Украшение рядом с котиком</div>
                    </div>
                </div>
                <button id="btn-mint" onclick="buyItem('mint', 500000)" class="bg-green-500 hover:bg-green-600 text-white px-3 py-2 rounded-lg font-bold text-sm transition shadow-sm flex items-center">500k <span class="fish-emoji-small">🐟</span></button>
            </div>
        </div>
    </div>

    <!-- Меню -->
    <div class="bg-white bg-opacity-90 border-t border-green-300 flex justify-around p-3 pb-6 absolute bottom-0 w-full z-20">
        <button onclick="switchTab('tap')" id="btn-tap" class="flex flex-col items-center text-green-600">
            <span class="text-2xl">🐱</span>
            <span class="text-xs mt-1 font-bold">Тапать</span>
        </button>
        <button onclick="switchTab('shop')" id="btn-shop" class="flex flex-col items-center text-gray-400">
            <span class="text-2xl">🛒</span>
            <span class="text-xs mt-1 font-bold">Магазин</span>
        </button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#a1c4fd';

        // Загружаем счет
        let score = parseInt(localStorage.getItem('catScore')) || 0;
        let tapPower = 1;

        // Загружаем состояние купленных предметов (true/false)
        let ownedItems = JSON.parse(localStorage.getItem('ownedItems')) || {
            yarn: false,
            mouse: false,
            mint: false
        };

        const scoreElement = document.getElementById('score');
        const catElement = document.getElementById('cat');
        const coinSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3');

        updateUI();
        updateDecor(); // Включаем купленные предметы при загрузке

        catElement.addEventListener('pointerdown', (e) => {
            score += tapPower;
            saveProgress();
            
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            
            coinSound.volume = 0.2;
            coinSound.currentTime = 0;
            coinSound.play().catch(() => {});

            createFloatingText(e.clientX, e.clientY, `+${tapPower}`);
            updateUI();

            // Прыжок
            catElement.style.transform = 'translateY(-30px) scale(0.95)';
            setTimeout(() => { catElement.style.transform = 'translateY(0) scale(1.05, 0.9)'; }, 150);
            setTimeout(() => { catElement.style.transform = 'translateY(0) scale(1)'; }, 300);
        });

        function buyItem(item, price) {
            // Проверка, куплен ли уже предмет
            if (item === 'yarn' || item === 'mouse' || item === 'mint') {
                if (ownedItems[item]) {
                    alert('Этот предмет уже куплен!');
                    return;
                }
            }

            if (score >= price) {
                score -= price;
                
                if (item === 'fish') {
                    activateBoost(10, 5000);
                } else if (item === 'yarn' || item === 'mouse' || item === 'mint') {
                    ownedItems[item] = true;
                    updateDecor();
                    saveProgress();
                }

                updateUI();
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                alert('Покупка успешна!');
            } else {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                alert('Недостаточно рыбок! Тапай больше!');
            }
        }

        function updateDecor() {
            if (ownedItems.yarn) {
                document.getElementById('decor-yarn').classList.add('active');
                document.getElementById('btn-yarn').innerText = 'Куплено';
                document.getElementById('btn-yarn').classList.replace('bg-green-500', 'bg-gray-400');
            }
            if (ownedItems.mouse) {
                document.getElementById('decor-mouse').classList.add('active');
                document.getElementById('btn-mouse').innerText = 'Куплено';
                document.getElementById('btn-mouse').classList.replace('bg-green-500', 'bg-gray-400');
            }
            if (ownedItems.mint) {
                document.getElementById('decor-mint').classList.add('active');
                document.getElementById('btn-mint').innerText = 'Куплено';
                document.getElementById('btn-mint').classList.replace('bg-green-500', 'bg-gray-400');
            }
        }

        function activateBoost(power, duration) {
            tapPower = power;
            setTimeout(() => {
                tapPower = 1; 
                alert('Действие буста закончилось!');
            }, duration);
        }

        function createFloatingText(x, y, text) {
            const el = document.createElement('div');
            el.innerText = text;
            el.className = 'float-text';
            el.style.left = (x - 15) + 'px';
            el.style.top = (y - 30) + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function updateUI() {
            // Форматируем большие числа (1000 -> 1k, 1000000 -> 1M)
            if (score >= 1000000) {
                scoreElement.innerText = (score / 1000000).toFixed(1) + 'M';
            } else if (score >= 1000) {
                scoreElement.innerText = (score / 1000).toFixed(1) + 'k';
            } else {
                scoreElement.innerText = score;
            }
        }

        function saveProgress() {
            localStorage.setItem('catScore', score);
            localStorage.setItem('ownedItems', JSON.stringify(ownedItems));
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            
            if (tab === 'tap') {
                document.getElementById('btn-tap').classList.replace('text-gray-400', 'text-green-600');
                document.getElementById('btn-shop').classList.replace('text-green-600', 'text-gray-400');
            } else {
                document.getElementById('btn-shop').classList.replace('text-gray-400', 'text-green-600');
                document.getElementById('btn-tap').classList.replace('text-green-600', 'text-gray-400');
            }
        }
    </script>
</body>
</html>
