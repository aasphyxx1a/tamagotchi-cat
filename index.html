<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тамагочи-Котик</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Природный фон */
        body {
            background: linear-gradient(to bottom, #a1c4fd 0%, #c2e9fb 35%, #d4fc79 65%, #96e6a1 100%);
            color: #333; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .clouds {
            position: absolute;
            top: 5%;
            left: 0;
            width: 100%;
            height: 150px;
            background: url('https://www.transparenttextures.com/patterns/clouds.png') repeat-x;
            opacity: 0.4;
            z-index: 0;
            pointer-events: none;
        }

        /* --- КОТИК --- */
        .cat-wrapper {
            position: relative;
            width: 200px;
            height: 180px;
            z-index: 10;
        }

        .cat-container {
            position: relative;
            width: 100%;
            height: 100%;
            cursor: pointer;
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.15));
            /* Плавное парение в состоянии покоя */
            animation: float 3s ease-in-out infinite;
        }

        /* Анимация прыжка при тапе */
        .jump-animation {
            animation: jump 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both !important;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes jump {
            0% { transform: translateY(0) scale(1); }
            30% { transform: translateY(-25px) scale(0.95); } /* Подлетает вверх и чуть сжимается */
            60% { transform: translateY(0) scale(1.05, 0.9); } /* Приземляется и плющится */
            100% { transform: translateY(0) scale(1); } /* Возвращается в норму */
        }

        /* Мордочка (серая) */
        .cat-face {
            position: absolute;
            bottom: 0;
            left: 10px;
            width: 180px;
            height: 130px;
            background-color: #5c6166; 
            border-radius: 90px 90px 70px 70px;
        }

        /* Ушки */
        .ear {
            position: absolute;
            top: -25px;
            width: 0;
            height: 0;
            border-left: 35px solid transparent;
            border-right: 35px solid transparent;
            border-bottom: 60px solid #5c6166;
        }
        .ear-left { left: 10px; transform: rotate(-15deg); }
        .ear-right { right: 10px; transform: rotate(15deg); }
        
        .ear-inner {
            position: absolute;
            top: 15px;
            left: -20px;
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 35px solid #404448;
        }

        /* Глазки */
        .eye {
            position: absolute;
            top: 40px;
            width: 36px;
            height: 42px;
            background-color: #222;
            border-radius: 50%;
        }
        .eye-left { left: 35px; }
        .eye-right { right: 35px; }

        .eye::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            width: 14px;
            height: 14px;
            background: white;
            border-radius: 50%;
        }
        .eye::after {
            content: '';
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
        }

        /* Щечки */
        .cheek {
            position: absolute;
            top: 85px;
            width: 25px;
            height: 14px;
            background-color: #ffb6c1;
            border-radius: 50%;
            opacity: 0.8;
        }
        .cheek-left { left: 20px; }
        .cheek-right { right: 20px; }

        /* Носик и ротик */
        .nose {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 9px;
            background-color: #333;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
        }
        .mouth {
            position: absolute;
            top: 89px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 10px;
            border-bottom: 3px solid #333;
            border-radius: 0 0 50% 50%;
        }

        /* Усики */
        .whisker {
            position: absolute;
            width: 40px;
            height: 2px;
            background-color: #333;
            border-radius: 2px;
        }
        .whisker-l1 { top: 85px; left: -20px; transform: rotate(10deg); }
        .whisker-l2 { top: 95px; left: -20px; transform: rotate(-10deg); }
        .whisker-r1 { top: 85px; right: -20px; transform: rotate(-10deg); }
        .whisker-r2 { top: 95px; right: -20px; transform: rotate(10deg); }

        /* Лапки */
        .paw {
            position: absolute;
            bottom: -10px;
            width: 60px;
            height: 35px;
            background-color: #5c6166;
            border-radius: 30px 30px 20px 20px;
            border: 3px solid #333; 
        }
        .paw-left { left: 20px; }
        .paw-right { right: 20px; }

        .toes {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }
        .toe {
            width: 4px;
            height: 10px;
            background-color: #333;
            border-radius: 2px;
        }
        
        .float-text {
            position: absolute;
            color: #2e7d32; 
            font-weight: bold;
            font-size: 28px;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
            z-index: 50;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-60px); }
        }

        .tab-content { display: none; }
        .tab-content.active { display: flex; }

        /* Иконки Рыбок */
        .fish-emoji {
            font-size: 32px;
            line-height: 1;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
        }
        .fish-emoji-small {
            font-size: 18px;
            line-height: 1;
            margin-left: 4px;
        }
    </style>
</head>
<body>

    <div class="clouds"></div>

    <!-- Верхняя панель (Баланс) -->
    <div class="p-4 flex justify-center items-center mt-2 z-10">
        <div class="bg-white bg-opacity-80 rounded-full px-6 py-2 flex items-center shadow-md border border-green-300 gap-2">
            <span class="fish-emoji">🐟</span>
            <span id="score" class="text-3xl font-bold text-yellow-600">0</span>
        </div>
    </div>

    <!-- ЭКРАН 1: Тапалка -->
    <div id="tab-tap" class="tab-content active flex-grow flex flex-col justify-center items-center relative w-full z-10">
        
        <div class="cat-wrapper">
            <div id="cat" class="cat-container">
                <div class="ear ear-left"><div class="ear-inner"></div></div>
                <div class="ear ear-right"><div class="ear-inner"></div></div>
                <div class="cat-face">
                    <div class="eye eye-left"></div>
                    <div class="eye eye-right"></div>
                    <div class="cheek cheek-left"></div>
                    <div class="cheek cheek-right"></div>
                    <div class="nose"></div>
                    <div class="mouth"></div>
                    <div class="whisker whisker-l1"></div>
                    <div class="whisker whisker-l2"></div>
                    <div class="whisker whisker-r1"></div>
                    <div class="whisker whisker-r2"></div>
                </div>
                <div class="paw paw-left">
                    <div class="toes"><div class="toe"></div><div class="toe"></div></div>
                </div>
                <div class="paw paw-right">
                    <div class="toes"><div class="toe"></div><div class="toe"></div></div>
                </div>
            </div>
        </div>

        <div class="mt-12 text-green-900 font-bold text-lg z-10 opacity-60">Тапай по котику!</div>
    </div>

    <!-- ЭКРАН 2: Магазин -->
    <div id="tab-shop" class="tab-content flex-grow flex-col p-4 w-full overflow-y-auto pb-24 z-10 relative">
        <h2 class="text-2xl font-bold text-center mb-4 text-green-900 drop-shadow-sm">🛒 Магазин</h2>
        
        <div class="space-y-3 z-10">
            <!-- Предмет 1: Рыбка -->
            <div class="bg-white bg-opacity-90 p-4 rounded-xl flex justify-between items-center shadow-md border border-green-200">
                <div class="flex items-center gap-3">
                    <span class="fish-emoji">🐟</span>
                    <div>
                        <div class="font-bold text-gray-800">Вкусная рыбка</div>
                        <div class="text-xs text-gray-500">+10 к тапу (на 5 сек)</div>
                    </div>
                </div>
                <button onclick="buyItem('fish', 50)" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-bold text-sm transition shadow-sm flex items-center">
                    50 <span class="fish-emoji-small">🐟</span>
                </button>
            </div>

            <!-- Предмет 2: Клубок -->
            <div class="bg-white bg-opacity-90 p-4 rounded-xl flex justify-between items-center shadow-md border border-green-200">
                <div class="flex items-center gap-3">
                    <span class="text-3xl">🧶</span>
                    <div>
                        <div class="font-bold text-gray-800">Клубок ниток</div>
                        <div class="text-xs text-gray-500">+50 к тапу (на 5 сек)</div>
                    </div>
                </div>
                <button onclick="buyItem('yarn', 200)" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-bold text-sm transition shadow-sm flex items-center">
                    200 <span class="fish-emoji-small">🐟</span>
                </button>
            </div>
            
            <!-- Предмет 3: Шапка -->
            <div class="bg-white bg-opacity-90 p-4 rounded-xl flex justify-between items-center shadow-md border border-green-200">
                <div class="flex items-center gap-3">
                    <span class="text-3xl">🎩</span>
                    <div>
                        <div class="font-bold text-gray-800">Крутая шапка</div>
                        <div class="text-xs text-gray-500">Меняет вид котика</div>
                    </div>
                </div>
                <button onclick="buyItem('hat', 500)" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-bold text-sm transition shadow-sm flex items-center">
                    500 <span class="fish-emoji-small">🐟</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Нижняя панель навигации -->
    <div class="bg-white bg-opacity-90 border-t border-green-300 flex justify-around p-3 pb-6 absolute bottom-0 w-full z-20">
        <button onclick="switchTab('tap')" id="btn-tap" class="flex flex-col items-center text-green-600">
            <span class="text-2xl">🐱</span>
            <span class="text-xs mt-1 font-bold">Тапать</span>
        </button>
        <button onclick="switchTab('shop')" id="btn-shop" class="flex flex-col items-center text-gray-400">
            <span class="text-2xl">🛒</span>
            <span class="text-xs mt-1 font-bold">Магазин</span>
        </button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#a1c4fd';

        let score = parseInt(localStorage.getItem('catScore')) || 0;
        let tapPower = 1;

        const scoreElement = document.getElementById('score');
        const catElement = document.getElementById('cat');
        const coinSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3');

        updateUI();

        catElement.addEventListener('pointerdown', (e) => {
            score += tapPower;
            saveProgress();
            
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            
            coinSound.volume = 0.2;
            coinSound.currentTime = 0;
            coinSound.play().catch(() => {});

            createFloatingText(e.clientX, e.clientY, `+${tapPower}`);
            updateUI();

            // --- АНИМАЦИЯ ПРЫЖКА ---
            // Убираем класс анимации, чтобы можно было запустить её заново
            catElement.classList.remove('jump-animation');
            
            // Небольшая задержка (10 мс), чтобы браузер успел "заметить" удаление класса
            setTimeout(() => {
                catElement.classList.add('jump-animation');
            }, 10);
        });

        // Убираем класс прыжка после завершения анимации (через 300 мс)
        catElement.addEventListener('animationend', () => {
            catElement.classList.remove('jump-animation');
        });

        function buyItem(item, price) {
            if (score >= price) {
                score -= price;
                
                if (item === 'fish') {
                    activateBoost(10, 5000);
                } else if (item === 'yarn') {
                    activateBoost(50, 5000);
                } else if (item === 'hat') {
                    alert('Шапка куплена! (В разработке)'); 
                }

                saveProgress();
                updateUI();
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                if(item !== 'hat') alert('Покупка успешна!');
            } else {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                alert('Недостаточно рыбок! Тапай больше!');
            }
        }

        function activateBoost(power, duration) {
            tapPower = power;
            setTimeout(() => {
                tapPower = 1; 
                alert('Действие буста закончилось!');
            }, duration);
        }

        function createFloatingText(x, y, text) {
            const el = document.createElement('div');
            el.innerText = text;
            el.className = 'float-text';
            el.style.left = (x - 15) + 'px';
            el.style.top = (y - 30) + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function updateUI() {
            scoreElement.innerText = score;
        }

        function saveProgress() {
            localStorage.setItem('catScore', score);
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            
            if (tab === 'tap') {
                document.getElementById('btn-tap').classList.replace('text-gray-400', 'text-green-600');
                document.getElementById('btn-shop').classList.replace('text-green-600', 'text-gray-400');
            } else {
                document.getElementById('btn-shop').classList.replace('text-gray-400', 'text-green-600');
                document.getElementById('btn-tap').classList.replace('text-green-600', 'text-gray-400');
            }
        }
    </script>
</body>
</html>
